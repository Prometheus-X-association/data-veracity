[project]
name = "edge-node-server-demo"
version = "0.1.0"
description = "Orchestrates the edge node demo: anonymize, attest with the DVA, forward"
requires-python = ">=3.10"
dependencies = [
	"fastapi~=0.136.3",
	"httpx>=0.28",
	"uvicorn>=0.34.3",
]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
