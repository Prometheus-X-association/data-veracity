ktor:
  deployment:
    port: 9090
  application:
    modules:
      - hu.bme.mit.ftsrg.dva.api.ApplicationKt.module

swagger:
  # Sibling files this spec `$ref`s (eg components.yaml) are served from the same
  # directory; see docRoutes.
  openapiFile: "$DVA_OPENAPI_FILE:../docs/spec/dva-api.yaml"

postgres:
  url: "$DVA_POSTGRES_URL:postgresql://localhost:5432/dva"
  user: "$DVA_POSTGRES_USER:postgres"
  password: "$DVA_POSTGRES_PASSWORD:postgres"

processing:
  url: "$DVA_PROCESSING_URL:http://localhost:5000"

vlaManager:
  url: "$DVA_VLA_MANAGER_URL:http://localhost:8000"

vcManager:
  url: "$DVA_VC_MANAGER_URL:http://localhost:8000"

# The logical issuer this DVA names in the AoVs it has issued (the credential's
# `issuer_id` claim; the signing did:key is the VC Manager's own).
issuer:
  id: "$DVA_ISSUER_ID:dva-api"