---
name: Build VLA Manager


on:
  push:
    paths: [vla-manager/**]
  pull_request:
    paths: [vla-manager/**]


defaults:
  run:
    working-directory: ./vla-manager


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: vla-manager/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Build project
        run: pnpm run build
