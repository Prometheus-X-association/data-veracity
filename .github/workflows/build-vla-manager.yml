---
name: Build VLA Manager


on:
  push:
    paths:
      - vla-manager/**/*.js
      - vla-manager/**/*.html
      - vla-manager/src/**
      - vla-manager/package.json
      - vla-manager/pnpm-lock.yaml
      - vla-manager/public/**
      - .github/workflows/build-vla-manager.yml
  pull_request:
    paths:
      - vla-manager/**/*.js
      - vla-manager/**/*.html
      - vla-manager/src/**
      - vla-manager/package.json
      - vla-manager/pnpm-lock.yaml
      - vla-manager/public/**
      - .github/workflows/build-vla-manager.yml


permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    working-directory: ./vla-manager


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: vla-manager/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Build project
        run: pnpm run build
