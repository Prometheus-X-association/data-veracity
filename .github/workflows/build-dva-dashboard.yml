---
name: Build DVA Dashboard


on:
  push:
    paths:
      - dva-dashboard/**/*.js
      - dva-dashboard/**/*.html
      - dva-dashboard/src/**
      - dva-dashboard/package.json
      - dva-dashboard/pnpm-lock.yaml
      - dva-dashboard/public/**
      - .github/workflows/build-dva-dashboard.yml
  pull_request:
    paths:
      - dva-dashboard/**/*.js
      - dva-dashboard/**/*.html
      - dva-dashboard/src/**
      - dva-dashboard/package.json
      - dva-dashboard/pnpm-lock.yaml
      - dva-dashboard/public/**
      - .github/workflows/build-dva-dashboard.yml


permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    working-directory: ./dva-dashboard


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: dva-dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Build project
        run: pnpm run build
