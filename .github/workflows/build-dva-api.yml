---
name: Build and Test DVA API


on:
  push:
    paths:
      - dva-api/api/**
      - dva-api/model/**
      - dva-api/buildSrc/**
      - dva-api/**/*.gradle.kts
      - dva-api/gradle/**
      - dva-api/gradlew*
      - .github/workflows/build-dva-api.yml
  pull_request:
    paths:
      - dva-api/api/**
      - dva-api/model/**
      - dva-api/buildSrc/**
      - dva-api/**/*.gradle.kts
      - dva-api/gradle/**
      - dva-api/gradlew*
      - .github/workflows/build-dva-api.yml


permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    working-directory: ./dva-api


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build project
        run: ./gradlew assemble
      - name: Run Gradle checks
        run: ./gradlew check
