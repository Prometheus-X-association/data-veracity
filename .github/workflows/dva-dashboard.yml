name: Build DVA Dashboard

on:
  push:
    paths:
      - 'dva-dashboard/**'
  pull_request:
    paths:
      - 'dva-dashboard/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'dva-dashboard/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./dva-dashboard
        run: pnpm install

      - name: Run Build
        working-directory: ./dva-dashboard
        run: pnpm run build