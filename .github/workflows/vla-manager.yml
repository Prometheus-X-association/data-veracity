name: Build VLA Manager

on:
  push:
    paths:
      - 'vla-manager/**'
  pull_request:
    paths:
      - 'vla-manager/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'vla-manager/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./vla-manager
        run: pnpm install

      - name: Run Build
        working-directory: ./vla-manager
        run: pnpm run build