---
name: Build and Test DVA Processing


on:
  push:
    paths:
      - dva-processing/src/**
      - dva-processing/tests/**
      - dva-processing/pyproject.toml
      - dva-processing/uv.lock
      - .github/workflows/build-dva-processing.yml
  pull_request:
    paths:
      - dva-processing/src/**
      - dva-processing/tests/**
      - dva-processing/pyproject.toml
      - dva-processing/uv.lock
      - .github/workflows/build-dva-processing.yml


permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    working-directory: ./dva-processing


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          working-directory: ./dva-processing
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Pytest
        run: uv run --no-sync pytest
